---
apiVersion: v1
kind: Pod
metadata:
  name: postgresql
spec:
  containers:
    - name: postgresql
      image: postgres:16.3-bullseye
      env:
        - name: POSTGRES_USER
          value: "root"
        - name: POSTGRES_HOST_AUTH_METHOD
          value: "trust"
      tty: true
---
apiVersion: v1
kind: Pod
metadata:
  name: mysql
spec:
  containers:
    - name: mysql
      image: mysql:8.4.4
      command:
        - "--character-set-server=utf8"
        - "--connect_timeout=120"
        - "--max_allowed_packet=104857600"
        - "--wait_timeout=1200"
        - "--tls-version=TLSv1.2"
      env:
        - name: MYSQL_ALLOW_EMPTY_PASSWORD
          value: "yes"
      securityContext:
        privileged: true
      tty: true

