<!DOCTYPE html>

<html>
	<head>
		<style>
			canvas {
				display: block;
				height: 300px;
				width: 1900px;
			}
		</style>

		<script src="http://www.datejs.com/build/date.js" type="text/javascript"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.5.0/Chart.min.js"></script>

		<script src="build_database.js"></script>

		<script src="jenkins_report_data.js"></script>
		<script src="jenkins_report_timeline.js"></script>
	</head>
	<body>
		<header>
			<h1>Jenkins report for <span id="topLevelLink" /></h1>
			<p>Start Time: <span id="topLevelStartTime" /></p>
			<p>Build Time: <span id="topLevelBuildTime" /></p>
			<p>Total CPU Usage Time: <span id="totalCPUUsageTime" /></p>
			<p>Total number of Jenkins slaves used: <span id="totalJenkinsSlavesUsed" /></p>
			<p>Average delay time for invoked build to start: <span id="averageDelayTimeToStart" /></p>
			<p>Longest delay time for invoked build to start: <span id="longestDelayTimeToStart" /></p>
			<p>Longest Running Downstream Build: <span id="longestRunningDownstreamBuild" /></p>
		</header>

		<article>
			<canvas id="buildTimeline" />
		</article>

		<script type="text/javascript">
			init_data();

			init_timeline();
		</script>
	</body>
</html>
